plugins {
    id 'scala'
    id 'application'
}

repositories {
    mavenCentral()
}

ext {
    http4sVersion = '0.23.27'
    scalaBinaryVersion = '2.13'
}

dependencies {
    implementation "org.scala-lang:scala-library:2.13.14"
    implementation "org.http4s:http4s-ember-server_${scalaBinaryVersion}:${http4sVersion}"
    implementation "org.http4s:http4s-dsl_${scalaBinaryVersion}:${http4sVersion}"

    testImplementation "org.scalatest:scalatest_${scalaBinaryVersion}:3.2.19"
}

application {
    mainClass = 'com.rajuby2.health.Main'
}

test {
    useJUnitPlatform()
}

tasks.named('jar') {
    manifest {
        attributes 'Main-Class': 'com.rajuby2.health.Main'
    }
}
