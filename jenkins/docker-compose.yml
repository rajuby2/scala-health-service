services:
  jenkins:
    build: .
    ports:
      - "8080:8080"   # Jenkins UI
      - "50000:50000" # inbound agent port (not needed for agent:any, harmless to expose)
    volumes:
      - jenkins_home:/var/jenkins_home
      - /run/podman/podman.sock:/run/podman/podman.sock
    restart: unless-stopped

volumes:
  jenkins_home:
